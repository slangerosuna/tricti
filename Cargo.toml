[package]
name = "tricti"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
tri-runtime = []
num_cpus = []

[dependencies]
inkwell = { version = "0.6.0", features = ["llvm18-1"] }
pest = "2.7.15"
pest_derive = "2.7.15"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.10"
libloading = "0.8"
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
